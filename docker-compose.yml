services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_data
    restart: unless-stopped

  ingest:
    build: .
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_data
    command: python scripts/ingest.py --reset
    profiles:
      - setup

volumes:
  chroma_data:
